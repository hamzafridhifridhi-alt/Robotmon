[platformio]
default_envs = central_s3, gas_node, imu_node, encoder_node
src_dir = src
include_dir = include
data_dir = data

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -I include
lib_deps = bblanchon/ArduinoJson@^7.4.2

; Sensor-node boards currently use the user's provisional esp32dev assumption.
; This generic S3 DevKit profile is for Stage 2 compilation only. Confirm the
; physical board and replace it before upload if its exact model differs.
[env:central_s3]
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
build_src_filter = +<central_s3/*.cpp>

[env:gas_node]
board = esp32dev
build_src_filter = +<gas_node/*.cpp>

[env:imu_node]
board = esp32dev
build_src_filter = +<imu_node/*.cpp>

[env:encoder_node]
board = esp32dev
build_src_filter = +<encoder_node/*.cpp>
